# GitLab CI is off, so this job cannot run: releases are uploaded from a
# developer machine, as `docs/releasing.md` says.
#
# Publish the package to this project's GitLab PyPI registry so dependent
# libraries can install it as a versioned dependency using a deploy token
# with `read_package_registry` scope, e.g.:
#
#   pip install genetic_opt \
#     --index-url https://<token-name>:<token>@gitlab.com/api/v4/projects/<project-id>/packages/pypi/simple
#
# The publish job is available ONLY on tag pipelines (`vX.Y.Z`) and must
# be triggered manually. It publishes exactly the tagged release: the
# built version comes from `pyproject.toml`, which the tag must match
# (guarded below), and both an sdist and a wheel are uploaded.
#
# References:
#  https://docs.gitlab.com/ee/user/packages/pypi_repository/
#  https://docs.gitlab.com/ee/ci/jobs/ci_job_token.html

stages:
  - publish

publish-package:
  stage: publish
  # Pinned to a digest, since this job holds `CI_JOB_TOKEN`: a moved tag
  # cannot change what runs. The digest is the multi-arch index of
  # `python:3.14-slim` on Docker Hub, read 17th October 2026. To update:
  # read `docker-content-digest` from
  # https://registry-1.docker.io/v2/library/python/manifests/3.14-slim
  image: python:3.14-slim@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170
  rules:
    # Only offer the job on a semver tag pipeline, and only when clicked.
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: manual
      allow_failure: false
  script:
    # This job holds `CI_JOB_TOKEN`, so every package it installs, the
    # build backend included, is pinned with a hash. See
    # `ci/publish-requirements.in` for how the file is compiled.
    - pip install --no-cache-dir --require-hashes -r ci/publish-requirements.txt
    # Guard: the git tag must match the packaged version, so a mistagged
    # release never publishes under the wrong version.
    - VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/^version = "(.*)"/\1/')
    - |
      if [ "v${VERSION}" != "${CI_COMMIT_TAG}" ]; then
        echo "Tag ${CI_COMMIT_TAG} does not match pyproject version v${VERSION}"
        exit 1
      fi
    # Build both an sdist and a wheel with the hatchling installed above;
    # `--no-isolation` stops `build` downloading an unpinned one.
    - python -m build --no-isolation
    - >
      TWINE_USERNAME=gitlab-ci-token
      TWINE_PASSWORD=${CI_JOB_TOKEN}
      python -m twine upload
      --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi
      dist/*

