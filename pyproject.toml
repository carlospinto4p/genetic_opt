[project]
name = "genetic-opt"
version = "8.0.1"
description = "Genetic algorithm optimizers package."
authors = [{ name = "Carlos Pinto", email = "carlospinto4p@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=1.25.1,<3.0.0",
    "joblib>=1.3.2,<2.0.0",
    "matplotlib>=3.8.3,<4.0.0",
    # `import bson` comes from `pymongo`. The unrelated PyPI package
    # `bson` installs a module of the same name and would shadow it
    # (pymongo's own README warns against installing it).
    "pymongo>=4.8.0,<5.0.0",
    "pyyaml>=6.0.3,<7.0.0",
]

[project.optional-dependencies]
# The server of the explainer in `frontend/`, `genetic_opt.web`
web = [
    "fastapi>=0.143.3,<1.0.0",
    # `web/app.py` imports it itself
    "pydantic>=2.14.1,<3.0.0",
    "uvicorn>=0.54.0,<1.0.0",
]

[dependency-groups]
dev = [
    # FastAPI's `TestClient` needs it
    "httpx2>=2.13.1,<3.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "ruff>=0.16.4,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.32.4,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genetic_opt"]

# Without it the sdist holds every file git tracks. The Rust crate is
# left out: the Python package does not use it, and the tests that
# need it skip without it.
[tool.hatch.build.targets.sdist]
# Anchored: a bare `tests` also takes `crates/genetic_opt/tests`.
include = ["/src/genetic_opt", "/tests", "/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: builds and runs the Rust crate; needs cargo",
]

# Without this table, ruff run from another folder takes that folder's
# settings, Python target included.
[tool.ruff]
line-length = 78
