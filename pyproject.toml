[project]
name = "genetic-opt"
version = "0.15.0"
description = "Genetic algorithm optimizers package."
authors = [{ name = "Carlos Pinto", email = "carlospinto4p@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=1.25.1,<2.0.0",
    "joblib>=1.3.2,<2.0.0",
    "matplotlib>=3.8.3,<4.0.0",
    "pymongo>=4.8.0,<5.0.0",
    "pyyaml>=6.0.3,<7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.16.4,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.32.4,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genetic_opt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: builds and runs the Rust crate; needs cargo",
]

# Without this table, ruff run from another folder takes that folder's
# settings, Python target included.
[tool.ruff]
line-length = 78
