[project]
name = "genetic-opt"
version = "0.2.11"
description = "Genetic algorithm optimizers package."
authors = [{ name = "Carlos Pinto", email = "carlospinto4p@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.25.1,<2.0.0",
    "joblib>=1.3.2,<2.0.0",
    "cpinto>=0.3.9,<0.4.0",
    "matplotlib>=3.8.3,<4.0.0",
    "bson>=0.5.10,<0.6.0",
    "pymongo>=4.8.0,<5.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]

[tool.uv.sources]
cpinto = { index = "gitlab_cpinto" }

[[tool.uv.index]]
name = "gitlab_cpinto"
url = "https://gitlab.com/api/v4/projects/42232103/packages/pypi/simple"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genetic_opt"]
