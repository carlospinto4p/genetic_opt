[tool.poetry]
name = "genetic-opt"
version = "0.1.16"
description = "Genetic algorithm optimizers package."
authors = ["Carlos Pinto <carlospinto4p@gmail.com>"]
readme = "README.md"
packages = [{include = "genetic_opt", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^1.25.1"
joblib = "^1.3.2"
cpinto = {version = "^0.3.4", source = "gitlab_cpinto"}
matplotlib = "^3.8.3"


[[tool.poetry.source]]
name = "gitlab_cpinto"
url = "https://gitlab.com/api/v4/projects/42232103/packages/pypi/simple"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
