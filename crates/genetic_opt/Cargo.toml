[package]
name = "genetic_opt"
# Kept equal to the version in the repository's `pyproject.toml`, which
# `tests/unit/test_versions.py` checks.
version = "2.0.5"
edition = "2024"
description = "Genetic algorithm optimizers."

[dependencies]
bson = { version = "3.1.0", features = ["serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["now"] }
rand = "0.10.3"
rand_chacha = "0.10.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
